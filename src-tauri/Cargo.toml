[package]
name = "asistente-visitas"
version = "0.1.0"
description = "Asistente de visitas"
authors = ["Yorlen Batista"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-log = { version = "2.4.2", features = [] }
tauri-plugin-dialog = { version = "2.4.2", features = [] }  # Cambiado a 2.4.2
tauri-plugin-fs = { version = "2.4.2", features = [] }      # Cambiado a 2.4.2
dirs = "5.0"
chrono = "0.4.38"
